name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (biome + typecheck + tests)
        run: pnpm check

      - name: Build
        run: pnpm build

      # Exercise the audit command end-to-end (static layer — no browser, no
      # Flutter SDK) so spec-conformance regressions surface in CI.
      - name: Audit examples (static)
        run: |
          pnpm --filter @mcpapps/example-weather-vue exec mcpapps audit --static-only
          pnpm --filter @mcpapps/example-weather-flutter exec mcpapps audit --static-only

      # The runtime layer (lifecycle handshake, CSP-drift detection) is the
      # audit's most host-realistic check, so it's exercised here too — just
      # against weather-vue, since Flutter's runtime path needs a pre-built app
      # + toolchain this job doesn't have.
      - name: Install Playwright chromium
        run: pnpm --filter @mcpapps/cli exec playwright install --with-deps chromium

      - name: Audit examples (runtime)
        run: pnpm --filter @mcpapps/example-weather-vue exec mcpapps audit --runtime

      # inline.browser.test.ts skips (not fails) in `pnpm check` above, since
      # chromium isn't installed yet at that point — re-run it now so it
      # actually executes in CI instead of always skipping.
      - name: Flutter real-browser test
        run: pnpm --filter @mcpapps/flutter test
